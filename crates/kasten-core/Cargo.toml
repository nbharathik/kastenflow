[package]
name = "kasten-core"
description = "Vault model, parser, ops, guardrails, index and git for KastenFlow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fd-lock = "4.0.4"
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-libgit2"] }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = "1"
serde_json.workspace = true
# The pictures' hash, sidecar, size and thumbnails, shared with `slides dev`.
slides-assets.workspace = true
# The BibTeX span scanner a `.bib` file is edited with, shared with the Slides reader.
slides-bib.workspace = true

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[lints]
workspace = true

[[bench]]
name = "core"
harness = false
