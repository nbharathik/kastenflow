[package]
name = "kasten-mcp"
description = "MCP server for KastenFlow vaults (stdio and localhost HTTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The command-line program draws slides (render_slide, render_grid, and exact text sizes for lint) where
# Chrome, Chromium or Edge is installed. The desktop app asks for it too only if the installer stays
# within its budget; without the feature those tools say so in a sentence and nothing else changes.
default = ["render"]
render = ["dep:slides-render"]

[dependencies]
kasten-core.workspace = true
# The deck tools: the same code `slides mcp` runs, on a store that reads and writes through kasten-core.
slides-core.workspace = true
# PowerPoint files in and out, for the export and import_pptx tools.
slides-pptx.workspace = true
# Slides drawn by a headless browser, with the page it draws them with built in (about 9.8 MB).
slides-render = { workspace = true, optional = true }
rmcp = { version = "3.4.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
# Serving rmcp's streamable HTTP service; all already in the tree through rmcp and Tauri.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
getrandom = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
